name: windows-build

on:
  push:
    branches: [ "master", "test-staging", "cm-pinned-core" ]
  pull_request:
    branches: [ "master", "test-staging" ]
  workflow_dispatch: {}

concurrency:
  group: "windows-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      CMAKE_GENERATOR: Ninja
      CTOOLS_BUILD: none

    steps:
      # Pinned to the core the live server runs: its data/sql/updates set
      # matches the server's bundled sql-source exactly (newest db_world
      # 2026_09_20_00), so swapping the binary applies no DB migrations and
      # the fork compiles without chasing later core API changes.
      - name: Checkout AzerothCore
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: '7f12e89ee5f467a50e62eba1d525eac7dc953d03'
          path: a

      # The LLM commander lives in THIS fork, which is a full mod-playerbots
      # module (entire AI tree + the LlmBots/ continuity+tools patch). Build it
      # as the playerbots module instead of upstream so the CM changes compile in.
      - name: Checkout LLM commander fork (as mod-playerbots)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          path: a/modules/mod-playerbots

      # The running server also has these modules compiled in. Include them so
      # the rebuilt worldserver keeps the same statically-linked features.
      # Same module sources and revisions as the live server's sql-source.
      - name: Checkout mod-ah-bot-plus
        uses: actions/checkout@v4
        with:
          repository: 'NathanHandley/mod-ah-bot-plus'
          ref: 'f685832994c825f90aa5a3dc0e1620aa568e875b'
          path: a/modules/mod-ah-bot-plus

      - name: Checkout mod-individual-progression
        uses: actions/checkout@v4
        with:
          repository: 'ZhengPeiRu21/mod-individual-progression'
          ref: '723c510c685cca184d8b96b6c22452bd48fda23a'
          path: a/modules/mod-individual-progression

      - name: Move source tree to short path
        shell: powershell
        run: |
          if (Test-Path C:\ac) {
            Remove-Item C:\ac -Recurse -Force
          }

          New-Item -ItemType Directory -Path C:\ac | Out-Null

          robocopy "${{ github.workspace }}\a" "C:\ac" /MIR /NFL /NDL /NJH /NJS /NP

          if ($LASTEXITCODE -le 7) {
            exit 0
          }

          exit $LASTEXITCODE

      - name: Install Boost and Ninja
        shell: powershell
        run: |
          choco install ninja -y --no-progress
          choco install boost-msvc-14.3 --version=1.87.0 -y --no-progress

      - name: Prepare OpenSSL from runner image
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64"
          )

          $opensslRoot = $null

          foreach ($candidate in $candidates) {
            if ((Test-Path "$candidate\bin\openssl.exe") -and (Test-Path "$candidate\include\openssl\ssl.h")) {
              $opensslRoot = $candidate
              break
            }
          }

          if (-not $opensslRoot) {
            Write-Host "OpenSSL candidates checked:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            throw "OpenSSL development files not found on runner image"
          }

          if (Test-Path C:\openssl) {
            Remove-Item C:\openssl -Recurse -Force
          }

          New-Item -ItemType Junction -Path C:\openssl -Target $opensslRoot | Out-Null

          "OPENSSL_ROOT_DIR=C:\openssl" >> $env:GITHUB_ENV
          "OPENSSL_DIR=C:\openssl" >> $env:GITHUB_ENV
          "PATH=C:\openssl\bin;$env:PATH" >> $env:GITHUB_ENV

          C:\openssl\bin\openssl.exe version

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13

      - name: Create AzerothCore CI config
        shell: bash
        working-directory: C:\ac
        run: |
          mkdir -p conf

          cat > conf/config.sh <<'EOF'
          CCOMPILERC="cl"
          CCOMPILERCXX="cl"

          CTYPE="Release"
          CSCRIPTS="static"
          CMODULES="static"
          CTOOLS_BUILD="none"

          CCUSTOMOPTIONS="-DBOOST_ROOT=C:/local/boost_1_87_0 -DOPENSSL_ROOT_DIR=C:/openssl -DOPENSSL_USE_STATIC_LIBS=FALSE -DCMAKE_RC_COMPILER=rc -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON -DCMAKE_NINJA_CMCLDEPS_RC=OFF -DCMAKE_C_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_LIBRARIES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_LIBRARIES=ON"
          EOF

          cat conf/config.sh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Build
        shell: bash
        working-directory: C:\ac
        run: |
          export CTOOLS_BUILD=none
          export CMAKE_GENERATOR=Ninja

          export CC=cl
          export CXX=cl
          export RC=rc

          cmake --version
          ninja --version

          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "BOOST_ROOT=$BOOST_ROOT"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"

          which cl || true
          which rc || true
          which openssl || true

          cl || true
          rc || true
          openssl version || true

          rm -rf var/build/obj

          ./acore.sh compiler build

      # Gather the built worldserver.exe (+ sibling DLLs, authserver.exe, and
      # the OpenSSL runtime DLLs the build links against) into one artifact so
      # the binary can be hot-swapped into the server.
      - name: Collect artifacts
        if: always()
        shell: powershell
        run: |
          $out = "C:\artifact"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $ws = Get-ChildItem -Path C:\ac -Recurse -Filter worldserver.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ws) {
            Write-Host "Found: $($ws.FullName)"
            Copy-Item $ws.FullName $out -Force
            Get-ChildItem -Path $ws.Directory -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $out -Force }
          } else {
            Write-Host "worldserver.exe NOT found under C:\ac"
          }

          $as = Get-ChildItem -Path C:\ac -Recurse -Filter authserver.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($as) { Copy-Item $as.FullName $out -Force }

          if (Test-Path C:\openssl\bin) {
            Get-ChildItem C:\openssl\bin -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $out -Force }
          }

          Write-Host "--- artifact contents ---"
          Get-ChildItem $out | Select-Object Name,Length

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldserver-win64-cm
          path: C:\artifact
          if-no-files-found: warn
